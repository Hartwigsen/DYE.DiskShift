name: Build traceable qemu-img bundle
on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: 'Optional completed run ID: reuse its already compiled binary, verifying runtime versions'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make patch tar diffutils base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
      - name: Build minimal tools
        if: inputs.reuse_run == ''
        run: bash tools/build-qemu.sh
      - name: Reuse completed build artifact
        if: inputs.reuse_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          if ($env:REUSE_RUN -notmatch '^\d+$') { throw 'Invalid run ID' }
          gh run download $env:REUSE_RUN --name traceable-qemu-img --dir qemu-build-output
      - name: Collect dependency sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/collect-qemu-sources.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: traceable-qemu-img
          path: qemu-build-output/
          compression-level: 6
